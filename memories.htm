<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكرياتنا الجميلة 📸</title>
    <style>
        :root { --pink: #ff6584; --bg: #fff0f3; }
        body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; padding: 20px 10px 100px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 25px; padding: 20px; max-width: 450px; width: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.04); border: 1px solid #ffccd5; text-align: center; margin-bottom: 20px; }
        h2 { color: var(--pink); margin-bottom: 15px; }
        
        /* العداد */
        .counter-grid { display: flex; justify-content: space-around; margin: 15px 0; }
        .counter-item { background: var(--bg); padding: 10px; border-radius: 15px; width: 22%; }
        .counter-item span { display: block; font-size: 20px; font-weight: bold; color: var(--pink); }
        .counter-item label { font-size: 11px; color: #666; }

        /* التايم لاين والذكريات */
        .memory-box { text-align: right; border-right: 3px solid var(--pink); padding: 5px 15px; margin: 20px 0; }
        .memory-date { font-size: 12px; color: var(--pink); font-weight: bold; margin-bottom: 5px; }
        .memory-img { width: 100%; border-radius: 15px; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* مشغل الموسيقى أسفل الشاشة */
        .music-player { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 30px; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 8px 32px rgba(255, 101, 132, 0.15); border: 1px solid rgba(255,255,255,0.5); z-index: 1000; }
        .track-info { display: flex; align-items: center; gap: 10px; text-align: right; }
        .track-img { width: 45px; height: 45px; border-radius: 50%; background: var(--pink); animation: spin 4s linear infinite; }
        .track-text h4 { font-size: 14px; color: var(--pink); margin: 0; }
        .track-text p { font-size: 11px; color: #777; margin: 0; }
        .player-controls button { background: none; border: none; font-size: 24px; color: var(--pink); cursor: pointer; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="track" src="music.mp3" autoplay loop></audio>

    <div class="card">
        <h2>بدايتنا سوا 🗓️</h2>
        <div class="counter-grid">
            <div class="counter-item"><span id="d">0</span><label>يوم</label></div>
            <div class="counter-item"><span id="h">0</span><label>ساعة</label></div>
            <div class="counter-item"><span id="m">0</span><label>دقيقة</label></div>
            <div class="counter-item"><span id="s">0</span><label>ثانية</label></div>
        </div>
    </div>

    <div class="card">
        <h2>شريط ذكرياتنا 📸</h2>
        <div class="memory-box">
            <div class="memory-date">2025-05-24</div>
            <p>يوم ما قولتلك بحبك ❤️</p>
            <img src="pic1.jpg" class="memory-img" onerror="this.style.display='none'">
        </div>
        <div class="memory-box">
     <div class="memory-date">2025-05-29</div>
            <p>يوم ما حضنا بعض ❤️</p>     
    </div>

    <div class="music-player">
        <div class="player-controls">
            <button id="playBtn" onclick="togglePlay()">⏸️</button>
        </div>
        <div class="track-info">
            <div class="track-text">
                <h4>نور عيني 😍</h4>
                <p>شغالة الآن...</p>
            </div>
            <div class="track-img"></div>
        </div>
    </div>

    <script>
        function updateCounter() {
            // هنا بنكتب تاريخ بداية علاقة العميل علشان العداد يحسب منه بالثواني
            // مثال: 24 مايو 2025
            const start = new Date('2025-05-24T00:00:00'); 
            const diff = new Date() - start;
            document.getElementById('d').innerText = Math.floor(diff / 86400000);
            document.getElementById('h').innerText = Math.floor((diff % 86400000) / 3600000);
            document.getElementById('m').innerText = Math.floor((diff % 3600000) / 60000);
            document.getElementById('s').innerText = Math.floor((diff % 60000) / 1000);
        }
        setInterval(updateCounter, 1000);

        const audio = document.getElementById('track');
        const btn = document.getElementById('playBtn');
        function togglePlay() {
            if(audio.paused) { audio.play(); btn.innerText = '⏸️'; } 
            else { audio.pause(); btn.innerText = '▶️'; }
        }
        document.addEventListener('click', () => { audio.play().catch(()=>{}) }, {once: true});
    </script>
</body>
</html>
